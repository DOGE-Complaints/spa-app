<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.png" type="image/png" />
    <title>DOGEstonia</title>
    <!-- REQ21-04: FOUC — prefer localStorage dogestonia.theme; else default dark. No OS theme. -->
    <script>
      (function () {
        var root = document.documentElement
        var stored = null
        try {
          stored = localStorage.getItem('dogestonia.theme')
        } catch (e) {}
        if (stored === 'light' || stored === 'dark') {
          root.setAttribute('data-theme', stored)
        } else if (!root.getAttribute('data-theme')) {
          root.setAttribute('data-theme', 'dark')
        }
        var theme = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark'
        root.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
