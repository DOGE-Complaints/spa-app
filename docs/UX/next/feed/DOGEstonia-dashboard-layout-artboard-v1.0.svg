<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="2200" viewBox="0 0 3200 2200">
  <defs>
    <style>
      .bg{fill:#f3f1eb}.paper{fill:#fff}.surface{fill:#fffdf8}.ink{fill:#101828}.muted{fill:#667085}.line{stroke:#d9d5ca;stroke-width:2}.grid{stroke:#f5c542;stroke-width:1;opacity:.22}.measure{stroke:#e96b19;stroke-width:2;fill:none}.dash{stroke-dasharray:8 8}.navy{fill:#111827}.yellow{fill:#f5c542}.orange{fill:#e96b19}.soft{fill:#f1efe9}.green{fill:#d8f3df}.blue{fill:#e6efff}.shadow{filter:url(#shadow)}
      text{font-family:Inter,Arial,sans-serif}.h1{font-size:42px;font-weight:750}.h2{font-size:26px;font-weight:700}.h3{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:13px}.micro{font-size:11px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.white{fill:white}.center{text-anchor:middle}.end{text-anchor:end}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#101828" flood-opacity=".12"/></filter>
    <pattern id="eight" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M8 0H0V8" fill="none" class="grid"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M8 4L0 0V8Z" fill="#e96b19"/></marker>
  </defs>

  <rect width="3200" height="2200" class="bg"/>
  <text x="80" y="74" class="h1 ink">DOGEstonia dashboard — responsive layout contract</text>
  <text x="80" y="112" class="body muted">Figma-style implementation artboard · v1.0 · 8 px base grid · light theme geometry</text>
  <rect x="2660" y="44" width="460" height="64" rx="16" class="navy"/>
  <text x="2890" y="84" class="h3 white center">PRIMARY FRAME · 1440 × 1024</text>

  <!-- PRIMARY DESKTOP FRAME -->
  <g transform="translate(80 170)">
    <rect width="2040" height="1280" rx="18" class="paper shadow"/>
    <rect width="2040" height="1280" rx="18" fill="url(#eight)"/>
    <text x="28" y="42" class="h2 ink">A · Canonical desktop /board</text>
    <text x="2010" y="42" class="small mono muted end">reference viewport 1440 × 1024 · diagram scale 1.35×</text>

    <!-- browser viewport translated 48,76 and scale 1.35 (1440x900 visible) -->
    <g transform="translate(48 76) scale(1.35)">
      <rect width="1440" height="864" rx="10" class="surface line"/>
      <!-- header -->
      <rect width="1440" height="64" rx="10" class="paper"/>
      <line x1="0" y1="64" x2="1440" y2="64" class="line"/>
      <circle cx="31" cy="32" r="18" class="yellow"/><text x="31" y="37" class="small ink center">DOGE</text>
      <text x="60" y="38" class="h3 ink">DOGEstonia</text><line x1="179" y1="18" x2="179" y2="46" class="line"/>
      <text x="196" y="38" class="body ink">Uus Veerenni</text>
      <rect x="390" y="13" width="320" height="38" rx="19" class="soft"/><text x="420" y="37" class="small muted">Search issues</text>
      <text x="802" y="38" class="body ink">▣  Board</text><rect x="780" y="61" width="104" height="3" class="yellow"/>
      <text x="930" y="38" class="body ink">ⓘ  How it works</text>
      <text x="1260" y="38" class="small ink">EN</text><text x="1320" y="38" class="body ink">☼  ◌  ●</text>

      <!-- column grid -->
      <rect x="28" y="88" width="240" height="704" rx="10" fill="#f8f6f0" stroke="#d9d5ca"/>
      <rect x="288" y="88" width="824" height="748" rx="10" class="paper line"/>
      <rect x="1132" y="88" width="280" height="704" rx="10" fill="#f8f6f0" stroke="#d9d5ca"/>

      <!-- left rail -->
      <text x="44" y="120" class="h3 ink">Your profile</text><circle cx="72" cy="158" r="24" fill="#e9c5a7"/><text x="108" y="155" class="body ink">Kadi</text><text x="108" y="177" class="small muted">● Verified</text>
      <rect x="40" y="204" width="216" height="44" rx="8" fill="#fee9a5"/><text x="60" y="232" class="body ink">⌂   Board</text>
      <text x="60" y="282" class="body ink">▧   My stories</text><text x="60" y="328" class="body ink">♙   Profile</text>
      <rect x="40" y="352" width="216" height="48" rx="8" class="yellow"/><text x="148" y="382" class="body ink center">＋ Tell a story</text>
      <line x1="40" y1="424" x2="256" y2="424" class="line"/><text x="44" y="458" class="small muted">ACTIVE NODE</text><text x="60" y="494" class="body ink">●   Uus Veerenni</text>

      <!-- feed toolbar -->
      <text x="312" y="130" style="font-size:28px;font-weight:750" class="ink">Uus Veerenni board</text><text x="312" y="154" class="body muted">Shared local issues shaped from residents’ stories.</text>
      <rect x="312" y="174" width="280" height="40" rx="20" class="surface line"/><text x="336" y="199" class="small muted">Search issues in this node</text>
      <rect x="606" y="176" width="92" height="36" rx="18" class="yellow"/><text x="652" y="199" class="small ink center">All issues</text>
      <rect x="706" y="176" width="70" height="36" rx="18" class="soft"/><text x="741" y="199" class="small ink center">Needs</text>
      <rect x="784" y="176" width="64" height="36" rx="18" class="soft"/><text x="816" y="199" class="small ink center">Ideas</text>
      <rect x="948" y="174" width="140" height="40" rx="8" class="soft"/><rect x="948" y="174" width="72" height="40" rx="8" class="yellow"/><text x="984" y="199" class="small ink center">List</text><text x="1054" y="199" class="small ink center">Map</text>

      <!-- issue post -->
      <rect x="312" y="240" width="776" height="544" rx="12" class="surface line"/>
      <circle cx="352" cy="280" r="24" fill="#d88212"/><text x="388" y="264" class="small muted">ISSUE UV-024   ● OPEN   NEIGHBOURHOOD SUPPORT</text><text x="388" y="286" class="small muted">⌖ Uus Veerenni · Updated today</text>
      <text x="388" y="320" class="h2 ink">A trusted neighbour network for pet care</text><text x="388" y="346" class="small muted">Residents need a simple way to find trusted neighbours for short-term pet care.</text>
      <rect x="388" y="360" width="62" height="26" rx="13" class="soft"/><text x="419" y="377" class="micro ink center">Pets</text><rect x="458" y="360" width="82" height="26" rx="13" class="soft"/><text x="499" y="377" class="micro ink center">Mutual help</text>
      <text x="388" y="410" class="small orange">Open issue →</text>
      <rect x="328" y="430" width="744" height="258" rx="10" fill="#d9e8cb"/>
      <circle cx="610" cy="566" r="56" fill="#e9b44c"/><circle cx="790" cy="548" r="44" fill="#d4a27e"/><path d="M328 620C470 520 620 650 760 570S930 610 1072 510V688H328Z" fill="#8fbd72" opacity=".8"/>
      <line x1="328" y1="704" x2="1072" y2="704" class="line"/>
      <text x="406" y="738" class="body ink center">♡  React</text><text x="600" y="738" class="body ink center">○  Comment</text><text x="800" y="738" class="body ink center">↗  Share</text><text x="1014" y="738" class="small muted center">●● Reactions</text>
      <line x1="514" y1="714" x2="514" y2="748" class="line"/><line x1="716" y1="714" x2="716" y2="748" class="line"/><line x1="914" y1="714" x2="914" y2="748" class="line"/>

      <!-- right rail -->
      <rect x="1148" y="104" width="248" height="220" rx="10" class="paper line"/><rect x="1164" y="120" width="216" height="82" rx="8" fill="#dce9d3"/><text x="1164" y="228" class="h3 ink">Uus Veerenni civic node</text><text x="1164" y="254" class="small muted">Independent local node</text><text x="1164" y="292" class="small orange">About this node →</text>
      <rect x="1148" y="340" width="248" height="260" rx="10" class="paper line"/><text x="1164" y="372" class="h3 ink">How this board works</text><text x="1164" y="412" class="small ink">1   People share stories</text><text x="1164" y="452" class="small ink">2   Similar experiences connect</text><text x="1164" y="492" class="small ink">3   Shared Issues become visible</text>
      <rect x="1148" y="616" width="248" height="176" rx="10" class="paper line"/><text x="1164" y="650" class="h3 ink">Participation</text><text x="1164" y="688" class="small ink">✓ Verified member</text>
    </g>

    <!-- dimension calls around scaled viewport -->
    <line x1="48" y1="54" x2="1992" y2="54" class="measure" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="1020" y="47" class="small mono orange center">1440 px viewport</text>
    <line x1="48" y1="116" x2="1992" y2="116" class="measure dash"/><text x="2006" y="122" class="small mono orange">64 header</text>
    <line x1="86" y1="1225" x2="410" y2="1225" class="measure" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="248" y="1216" class="small mono orange center">240 left rail</text>
    <line x1="437" y1="1225" x2="1549" y2="1225" class="measure" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="993" y="1216" class="small mono orange center">824 flexible feed</text>
    <line x1="1576" y1="1225" x2="1954" y2="1225" class="measure" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="1765" y="1216" class="small mono orange center">280 right rail</text>
    <text x="418" y="1252" class="small mono orange center">20 gap</text><text x="1562" y="1252" class="small mono orange center">20 gap</text>
  </g>

  <!-- RESPONSIVE PANELS -->
  <g transform="translate(2180 170)">
    <rect width="940" height="1280" rx="18" class="paper shadow"/>
    <text x="28" y="42" class="h2 ink">B · Responsive collapse</text>
    <text x="28" y="70" class="small muted">Same hierarchy; progressive rail removal</text>

    <!-- tablet 1024 -->
    <g transform="translate(28 104)">
      <text x="0" y="0" class="h3 ink">Tablet · 1024–1199</text><text x="880" y="0" class="small mono muted end">2-column</text>
      <rect y="18" width="884" height="430" rx="12" class="surface line"/>
      <rect y="18" width="884" height="56" rx="12" class="navy"/><text x="24" y="53" class="body white">DOGEstonia</text><rect x="308" y="29" width="260" height="34" rx="17" fill="#303949"/><text x="438" y="51" class="small white center">Search</text>
      <rect x="20" y="94" width="186" height="324" rx="10" class="soft"/><text x="113" y="122" class="small ink center">216 px rail</text>
      <rect x="226" y="94" width="638" height="324" rx="10" class="paper line"/><text x="545" y="122" class="small ink center">flexible feed · ≥640 px</text>
      <rect x="246" y="142" width="598" height="248" rx="10" fill="#f8f6f0" stroke="#d9d5ca"/><rect x="262" y="224" width="566" height="116" rx="8" fill="#d9e8cb"/><rect x="262" y="348" width="566" height="36" rx="8" class="soft"/>
      <text x="545" y="438" class="small muted center">Right-rail modules move after feed</text>
    </g>

    <!-- narrow tablet -->
    <g transform="translate(28 590)">
      <text x="0" y="0" class="h3 ink">Narrow tablet · 768–1023</text><text x="880" y="0" class="small mono muted end">1-column</text>
      <rect y="18" width="884" height="300" rx="12" class="surface line"/>
      <rect y="18" width="884" height="56" rx="12" class="navy"/><text x="24" y="53" class="body white">☰  DOGEstonia</text><text x="846" y="53" class="body white end">●</text>
      <rect x="90" y="94" width="704" height="194" rx="10" class="paper line"/><text x="442" y="120" class="small ink center">centered feed · max 760 px · 24 px minimum gutter</text><rect x="110" y="140" width="664" height="112" rx="8" fill="#d9e8cb"/><rect x="110" y="260" width="664" height="20" rx="6" class="soft"/>
    </g>

    <!-- mobile -->
    <g transform="translate(28 958)">
      <text x="0" y="0" class="h3 ink">Mobile · 390 reference</text><text x="880" y="0" class="small mono muted end">1-column / sheets</text>
      <g transform="translate(250 18)">
        <rect width="390" height="270" rx="20" class="surface line"/>
        <rect width="390" height="56" rx="20" class="navy"/><text x="18" y="36" class="body white">☰ DOGEstonia</text><text x="370" y="36" class="body white end">●</text>
        <rect x="16" y="72" width="358" height="180" rx="10" class="paper line"/><text x="32" y="98" class="small ink">Issue title · 18/24</text><rect x="32" y="112" width="326" height="82" rx="8" fill="#d9e8cb"/><rect x="32" y="202" width="326" height="42" rx="8" class="soft"/><text x="195" y="228" class="micro ink center">React · Comment · Share · Reactions</text>
      </g>
      <line x1="250" y1="306" x2="640" y2="306" class="measure" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="445" y="300" class="small mono orange center">390 px · 16 px gutters</text>
    </g>
  </g>

  <!-- COMPONENT GEOMETRY STRIP -->
  <g transform="translate(80 1510)">
    <rect width="3040" height="610" rx="18" class="paper shadow"/>
    <text x="28" y="48" class="h2 ink">C · Component geometry and overlay anchors</text>
    <text x="3012" y="48" class="small mono muted end">all dimensions in CSS px</text>

    <!-- Post anatomy -->
    <g transform="translate(28 82)">
      <text x="0" y="0" class="h3 ink">BoardIssuePost</text>
      <rect y="22" width="860" height="454" rx="12" class="surface line"/>
      <rect x="20" y="42" width="820" height="122" rx="8" class="soft"/><text x="430" y="90" class="body ink center">Civic identity block · padding 20</text><text x="430" y="118" class="small muted center">metadata → title → summary → labels/details → Open issue</text>
      <rect x="20" y="180" width="820" height="216" rx="10" fill="#d9e8cb"/><text x="430" y="292" class="h3 ink center">Media · 16:9 · 320–440 high on desktop</text>
      <rect x="20" y="404" width="820" height="56" rx="8" class="soft"/><text x="123" y="438" class="body ink center">React</text><text x="328" y="438" class="body ink center">Comment</text><text x="533" y="438" class="body ink center">Share</text><text x="738" y="438" class="body ink center">Reactions</text>
      <line x1="20" y1="492" x2="840" y2="492" class="measure" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="430" y="514" class="small mono orange center">100% feed width · 824 px at 1440 reference</text>
    </g>

    <!-- comment geometry -->
    <g transform="translate(952 82)">
      <text x="0" y="0" class="h3 ink">IssueThreadBlock</text>
      <rect y="22" width="690" height="454" rx="12" class="surface line"/>
      <circle cx="42" cy="74" r="20" fill="#e9c5a7"/><rect x="76" y="52" width="560" height="68" rx="16" class="soft"/><text x="94" y="79" class="small ink">Root comment · avatar 40</text><text x="94" y="102" class="micro muted">Reply · React · timestamp</text>
      <line x1="42" y1="98" x2="42" y2="174" class="line"/>
      <circle cx="86" cy="166" r="16" fill="#d2e1ef"/><rect x="116" y="146" width="500" height="62" rx="16" class="soft"/><text x="134" y="173" class="small ink">Depth 1 · +44 px desktop</text>
      <circle cx="130" cy="246" r="16" fill="#dfd2ef"/><rect x="160" y="226" width="456" height="62" rx="16" class="soft"/><text x="178" y="253" class="small ink">Depth 2 · +44 px</text>
      <circle cx="174" cy="326" r="16" fill="#d6ead4"/><rect x="204" y="306" width="412" height="62" rx="16" class="soft"/><text x="222" y="333" class="small ink">Depth 3 / visual max</text>
      <rect x="20" y="392" width="650" height="64" rx="28" class="soft"/><text x="50" y="430" class="small muted">Write a comment…</text><circle cx="636" cy="424" r="18" class="yellow"/>
    </g>

    <!-- overlays -->
    <g transform="translate(1706 82)">
      <text x="0" y="0" class="h3 ink">Overlay scale</text>
      <rect y="22" width="380" height="454" rx="12" fill="#f8f6f0" stroke="#d9d5ca"/>
      <rect x="28" y="52" width="320" height="268" rx="12" class="paper shadow"/><text x="48" y="84" class="h3 ink">People who reacted</text>
      <g class="small ink"><text x="86" y="126">Maarja Tamm</text><text x="86" y="166">Karl Saar</text><text x="86" y="206">Liis Kask</text><text x="86" y="246">Anton Petrov</text><text x="86" y="286">Helen Võsu</text></g>
      <g fill="#e9c5a7"><circle cx="58" cy="120" r="16"/><circle cx="58" cy="160" r="16"/><circle cx="58" cy="200" r="16"/><circle cx="58" cy="240" r="16"/><circle cx="58" cy="280" r="16"/></g>
      <text x="190" y="348" class="small mono orange center">320 wide · row 52 · max 440 high</text>
      <rect x="50" y="380" width="280" height="48" rx="24" class="yellow"/><text x="190" y="410" class="small ink center">anchor → reaction aggregate</text>
    </g>

    <!-- tokens -->
    <g transform="translate(2150 82)">
      <text x="0" y="0" class="h3 ink">Core tokens</text>
      <rect y="22" width="862" height="454" rx="12" class="surface line"/>
      <text x="24" y="62" class="small mono muted">SPACING / 8 px BASE</text>
      <g transform="translate(24 82)"><rect width="4" height="28" class="orange"/><rect x="36" width="8" height="28" class="orange"/><rect x="76" width="12" height="28" class="orange"/><rect x="120" width="16" height="28" class="orange"/><rect x="168" width="20" height="28" class="orange"/><rect x="220" width="24" height="28" class="orange"/><rect x="276" width="32" height="28" class="orange"/><text x="0" y="50" class="micro mono muted">4   8   12   16   20   24   32</text></g>
      <text x="24" y="180" class="small mono muted">SURFACES</text><rect x="24" y="198" width="100" height="52" rx="8" fill="#f7f6f2" stroke="#d9d5ca"/><rect x="140" y="198" width="100" height="52" rx="8" fill="#fff" stroke="#d9d5ca"/><rect x="256" y="198" width="100" height="52" rx="8" fill="#fffdf8" stroke="#d9d5ca"/>
      <text x="24" y="286" class="small mono muted">RADIUS / TARGETS</text><rect x="24" y="304" width="88" height="44" rx="8" class="soft"/><text x="68" y="332" class="micro ink center">r8</text><rect x="128" y="304" width="88" height="44" rx="12" class="soft"/><text x="172" y="332" class="micro ink center">r12</text><rect x="232" y="304" width="88" height="44" rx="22" class="soft"/><text x="276" y="332" class="micro ink center">44 min</text>
      <text x="24" y="392" class="small mono muted">LAYERING</text><text x="24" y="422" class="small ink">header 30 · popover 40 · toast 60 · Issue modal 70 · dialog 80</text>
    </g>
  </g>
</svg>
